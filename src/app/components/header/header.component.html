<nav
  class="navbar navbar-expand-lg navbar-light bg-white border-bottom shadow-sm py-3"
>
  <div class="container-fluid px-4">
    <a class="navbar-brand text-primary fw-bold fs-4 me-5" routerLink="/">
      {{ title }}
    </a>

    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav d-flex gap-4">
        <li class="nav-item" *ngFor="let link of navLinks">
          <a
            class="nav-link text-primary px-0"
            [routerLink]="link.path"
            routerLinkActive="active border-bottom border-primary border-2"
          >
            {{ link.label }}
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
