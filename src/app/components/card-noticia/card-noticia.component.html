<div class="card h-100">
  <div class="row g-0 h-100">
    <div class="col-4">
      <img
        [src]="imagen"
        class="img-fluid rounded-start h-100"
        [alt]="titulo"
      />
    </div>
    <div class="col-8">
      <div class="card-body">
        <h6 class="card-title">{{ titulo }}</h6>
        <p class="card-text small">
          {{ resumen }}
          <a href="#" class="text-primary">Ver más</a>
        </p>
      </div>
    </div>
  </div>
</div>
