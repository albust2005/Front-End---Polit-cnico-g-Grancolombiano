<div class="container py-4">
  <h2 class="text-primary fw-bold mb-4">Noticias</h2>

  <div class="row g-3 mb-2">
    <div class="col-12 col-md-6">
      <input
        type="text"
        class="form-control"
        placeholder="Busca por nombre...."
        [(ngModel)]="busqueda"
        (ngModelChange)="reiniciarPagina()"
      />
    </div>
    <div class="col-12 col-md-6">
      <select
        class="form-select"
        [(ngModel)]="categoriaSeleccionada"
        (ngModelChange)="reiniciarPagina()"
      >
        <option value="">Selecciona la categoría</option>
        <option *ngFor="let categoria of categorias" [value]="categoria">
          {{ categoria }}
        </option>
      </select>
    </div>
  </div>

  <div class="separador"></div>

  <div class="row row-cols-1 row-cols-md-2 g-4">
    <div class="col" *ngFor="let noticia of noticiasPagina">
      <app-card-noticia
        [titulo]="noticia.titulo"
        [imagen]="noticia.imagen"
        [resumen]="noticia.resumen"
      />
    </div>
  </div>

  <nav class="mt-4" *ngIf="totalPaginas > 1">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="paginaActual === 1">
        <a
          class="page-link"
          href="#"
          (click)="irAPagina(paginaActual - 1); $event.preventDefault()"
          >&lt;</a
        >
      </li>
      <li
        class="page-item"
        *ngFor="let pagina of paginasArray"
        [class.active]="paginaActual === pagina"
      >
        <a
          class="page-link"
          href="#"
          (click)="irAPagina(pagina); $event.preventDefault()"
          >{{ pagina }}</a
        >
      </li>
      <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
        <a
          class="page-link"
          href="#"
          (click)="irAPagina(paginaActual + 1); $event.preventDefault()"
          >&gt;</a
        >
      </li>
    </ul>
  </nav>
</div>
