<div class="container py-4" *ngIf="noticia; else noEncontrada">
  <article class="article">
    <section class="intro">
      <div class="intro-text">
        <div class="category">{{ noticia.categoria }}</div>

        <h1>{{ noticia.titulo }}</h1>

        <p class="summary">{{ noticia.resumen }}</p>

        <div class="actions">
          <button
            type="button"
            class="action-btn"
            [class.active]="noticia.destacada"
            (click)="toggleDestacada()">
            <i class="bi" [class.bi-star-fill]="noticia.destacada" [class.bi-star]="!noticia.destacada"></i>
            {{ noticia.destacada ? 'Desmarcar como destacada' : 'Marcar como destacada' }}
          </button>
          <button type="button" class="action-btn" (click)="editar()">
            <i class="bi bi-pencil-square"></i> Editar
          </button>
          <button type="button" class="action-btn" (click)="eliminar()">
            <i class="bi bi-trash-fill"></i> Eliminar
          </button>
        </div>
      </div>

      <figure class="main-image">
        <img [src]="noticia.imagen" [alt]="noticia.titulo" />
      </figure>
    </section>

    <div class="divider"></div>
  </article>
</div>

<ng-template #noEncontrada>
  <div class="container py-4">
    <p>No se encontró la noticia solicitada.</p>
  </div>
</ng-template>
