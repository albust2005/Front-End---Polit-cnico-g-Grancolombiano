<div class="container py-4">
  <h2 class="text-primary fw-bold mb-4">Tus favoritos</h2>

  <div class="row g-3 mb-2">
    <div class="col-12 col-md-6">
      <input
        type="text"
        class="form-control"
        placeholder="Busca por nombre...."
        [(ngModel)]="busqueda"
        (ngModelChange)="reiniciarPagina()"
      />
    </div>
    <div class="col-12 col-md-6">
      <div class="dropdown">
        <button class="btn btn-outline-secondary w-100 dropdown-toggle text-start d-flex justify-content-between align-items-center" type="button" data-bs-toggle="dropdown" aria-expanded="false">
          {{ categoriaSeleccionada || 'Seleccionar Categoria' }}
        </button>
        <ul class="dropdown-menu w-100 shadow">
          <li><a class="dropdown-item" (click)="categoriaSeleccionada = ''; reiniciarPagina()">Todas / Selecciona la categoria</a></li>
          <li *ngFor="let categoria of categorias">
            <a class="dropdown-item" (click)="categoriaSeleccionada = categoria; reiniciarPagina()">{{ categoria }}</a>
          </li>
        </ul>
      </div>
    </div>
  </div>

  <div class="separador"></div>

  <div class="row row-cols-1 row-cols-md-2 g-4">
    <div class="col" *ngFor="let favorito of noticiasPagina">
      <app-card-noticia
        [id]="favorito.id"
        [titulo]="favorito.titulo"
        [imagen]="favorito.imagen"
        [resumen]="favorito.resumen"
        [mostrarBotonDestacada]="false"
      />
    </div>
  </div>

  <nav class="mt-4" *ngIf="totalPaginas > 1">
    <ul class="pagination justify-content-center">
      <li class="page-item" [class.disabled]="paginaActual === 1">
        <a
          class="page-link"
          href="#"
          (click)="irAPagina(paginaActual - 1); $event.preventDefault()"
          >&lt;</a
        >
      </li>
      <li
        class="page-item"
        *ngFor="let pagina of paginasArray"
        [class.active]="paginaActual === pagina"
      >
        <a
          class="page-link"
          href="#"
          (click)="irAPagina(pagina); $event.preventDefault()"
          >{{ pagina }}</a
        >
      </li>
      <li class="page-item" [class.disabled]="paginaActual === totalPaginas">
        <a
          class="page-link"
          href="#"
          (click)="irAPagina(paginaActual + 1); $event.preventDefault()"
          >&gt;</a
        >
      </li>
    </ul>
  </nav>
</div>
